input {
  http {
    port  => 5044
    codec => json
  }
  file {
    path  => "/usr/share/logstash/data/elk_fallback.jsonl"
    start_position => "beginning"
    codec => json
    sincedb_path => "/dev/null"
  }
}

filter {
  # Timestamp normalization
  if [timestamp] {
    date {
      match    => ["timestamp", "ISO8601"]
      target   => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Tag by index type
  if [_index] =~ /decisions/ {
    mutate { add_tag => ["decision"] }
  } else if [_index] =~ /chat/ {
    mutate { add_tag => ["chat"] }
  } else if [_index] =~ /api/ {
    mutate { add_tag => ["api_log"] }
  }

  # Normalize risk score to float
  if [risk_score] {
    mutate {
      convert => { "risk_score" => "float" }
    }
  }
  if [confidence] {
    mutate {
      convert => { "confidence" => "float" }
    }
  }
  if [duration_ms] {
    mutate {
      convert => { "duration_ms" => "float" }
    }
  }
}

output {
  if "decision" in [tags] {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      index    => "aap_decisions-%{+YYYY.MM.dd}"
      action   => "index"
    }
  } else if "chat" in [tags] {
    elasticsearch {
      hosts  => ["http://elasticsearch:9200"]
      index  => "aap_chat_sessions-%{+YYYY.MM.dd}"
      action => "index"
    }
  } else if "api_log" in [tags] {
    elasticsearch {
      hosts  => ["http://elasticsearch:9200"]
      index  => "aap_api_logs-%{+YYYY.MM.dd}"
      action => "index"
    }
  } else {
    elasticsearch {
      hosts  => ["http://elasticsearch:9200"]
      index  => "aap_events-%{+YYYY.MM.dd}"
      action => "index"
    }
  }
  stdout { codec => dots }
}
